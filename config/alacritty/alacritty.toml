[terminal.shell]
program = "/usr/bin/zsh"

[window]
startup_mode = "Maximized"
decorations = "Full"
dynamic_padding = true

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[colors.primary]
background = "#282a36"
foreground = "#f8f8f2"

[colors.cursor]
text = "#282a36"
cursor = "#f8f8f2"

[colors.selection]
text = "#f8f8f2"
background = "#44475a"

[selection]
save_to_clipboard = true

[colors.normal]
black = "#21222c"
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#bd93f9"
magenta = "#ff79c6"
cyan = "#8be9fd"
white = "#f8f8f2"

[colors.bright]
black = "#6272a4"
red = "#ff6e6e"
green = "#69ff94"
yellow = "#ffffa5"
blue = "#d6acff"
magenta = "#ff92df"
cyan = "#a4ffff"
white = "#ffffff"

[[keyboard.bindings]]
key = "W"
mods = "Control"
action = "Quit"

[[keyboard.bindings]]
key = "X"
mods = "Control|Shift"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
mode = "~Vi|~Search"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
mode = "~Vi|~Search"
action = "Paste"

[[keyboard.bindings]]
key = "Y"
mode = "Vi|~Search"
action = "Copy"

[[keyboard.bindings]]
key = "Y"
mode = "Vi|~Search"
action = "ClearSelection"

[[keyboard.bindings]]
key = "Y"
mode = "Vi|~Search"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "Y"
mods = "Shift"
mode = "Vi|~Search"
action = "Copy"

[[keyboard.bindings]]
key = "Y"
mods = "Shift"
mode = "Vi|~Search"
action = "ClearSelection"

[[keyboard.bindings]]
key = "Y"
mods = "Shift"
mode = "Vi|~Search"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
mode = "Vi|~Search"
action = "Copy"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
mode = "Vi|~Search"
action = "ClearSelection"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
mode = "Vi|~Search"
action = "ToggleViMode"
