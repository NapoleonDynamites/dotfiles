[mgr]
ratio = [1, 4, 0]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
show_hidden = false
show_symlink = true

[opener]
browser = [
    { run = "firefox %s", orphan = true, desc = "Open in Firefox", for = "unix" },
]
video = [
    { run = "vlc %s", orphan = true, desc = "Open in VLC", for = "unix" },
]
edit = [
    { run = "nvim %s", block = true, desc = "Edit in Neovim", for = "unix" },
]
extract = [
    { run = "unar %s", block = true, desc = "Extract here", for = "unix" },
]
open = [
    { run = "xdg-open %s1", orphan = true, desc = "Open", for = "unix" },
]

[open]
prepend_rules = [
    { mime = "image/*", use = "browser" },
    { mime = "application/pdf", use = "browser" },
    { mime = "video/*", use = "video" },
    { mime = "application/zip", use = "extract" },
    { mime = "application/x-7z-compressed", use = "extract" },
    { mime = "application/x-rar", use = "extract" },
    { mime = "application/x-tar", use = "extract" },
    { mime = "application/gzip", use = "extract" },
    { mime = "application/x-xz", use = "extract" },
]
append_rules = [
    { url = "*", use = "edit" },
]
