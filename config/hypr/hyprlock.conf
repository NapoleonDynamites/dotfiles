# =========================
# Hyprlock – Omarchy style (2x)
# =========================

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# ---------- Background ----------
background {
    monitor =
    path =

    color = rgba(30, 30, 46, 1.0)   # #1E1E2E
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 1.1
    brightness = 0.95
}

# ---------- Clock ----------
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    font_size = 144            # 72 → 144
    font_family = JetBrainsMono Nerd Font
    color = rgba(230, 233, 239, 1.0)
    position = 0, 160          # 80 → 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B')"
    font_size = 36             # 18 → 36
    font_family = JetBrainsMono Nerd Font
    color = rgba(165, 173, 186, 1.0)
    position = 0, 40           # 20 → 40
    halign = center
    valign = center
}

# ---------- Password input ----------
input-field {
    monitor =
    size = 600, 88             # 300x44 → 600x88
    outline_thickness = 4      # 2 → 4
    dots_size = 0.33
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(76, 79, 105, 0.9)
    inner_color = rgba(30, 30, 46, 0.9)
    font_color = rgba(230, 233, 239, 1.0)

    fade_on_empty = false
    placeholder_text = <i>password</i>
    hide_input = false

    rounding = 20              # 10 → 20
    position = 0, -120         # -60 → -120
    halign = center
    valign = center
}

# ---------- Authentication feedback ----------
label {
    monitor =
    text = cmd[update:100] echo "$HYPRLOCK_STATUS"
    font_size = 24             # 12 → 24
    font_family = JetBrainsMono Nerd Font
    color = rgba(243, 139, 168, 1.0)
    position = 0, -220         # -110 → -220
    halign = center
    valign = center
}

